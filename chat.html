<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>gsgsChat</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #app {
      margin: 0;
      height: 100%;
      background: #0b1220;
      color: #e8eefc;
      font-family: system-ui, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
    }
    .topbar {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #22304a;
    }
    .topbar strong { font-size: 20px; }
    .topbar p {
      margin: 6px 0 0;
      color: #8ea0c3;
      font-size: 13px;
      line-height: 1.4;
    }
    #log {
      flex: 1;
      overflow: auto;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      background: #121b2e;
      border: 1px solid #2a3c5f;
      border-radius: 10px;
      padding: 10px 12px;
      max-width: 92%;
    }
    .msg .who {
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 600;
    }
    .msg .when {
      color: #6d7fa3;
      font-size: 11px;
      margin-left: 8px;
    }
    .msg .text {
      margin-top: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .empty { color: #6d7fa3; margin: auto; }
    form {
      display: flex;
      gap: 8px;
      padding: 10px 12px 14px;
      border-top: 1px solid #22304a;
      background: #0b1220;
    }
    input {
      flex: 1;
      border: 1px solid #2a3c5f;
      background: #121b2e;
      color: #e8eefc;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }
    button {
      border: 0;
      background: #38bdf8;
      color: #082f49;
      font-weight: 700;
      border-radius: 8px;
      padding: 0 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <strong>gsgsChat</strong>
      <p>Общий чат. Хост — GitHub. Отправка: напиши сообщение и подтверди issue в GitHub.</p>
    </header>
    <div id="log"><div class="empty">Пока пусто. Напиши первым.</div></div>
    <form id="form">
      <input id="text" maxlength="500" placeholder="Сообщение…" autocomplete="off" />
      <button type="submit">Отправить</button>
    </form>
  </div>
  <script>
    const REPO = "bleaxedware0/svgviewer";
    const FEED = "./chat.json";
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("text");
    let lastCount = -1;

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function formatTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString("ru-RU", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" });
    }

    function render(messages) {
      if (!messages.length) {
        log.innerHTML = '<div class="empty">Пока пусто. Напиши первым.</div>';
        return;
      }
      log.innerHTML = messages.map((message) => (
        '<div class="msg">' +
          '<div><span class="who">' + escapeHtml(message.user || "anon") + '</span>' +
          '<span class="when">' + escapeHtml(formatTime(message.createdAt)) + '</span></div>' +
          '<div class="text">' + escapeHtml(message.text || "") + '</div>' +
        '</div>'
      )).join("");
      log.scrollTop = log.scrollHeight;
    }

    async function refresh() {
      try {
        const response = await fetch(FEED + "?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) return;
        const data = await response.json();
        const messages = Array.isArray(data.messages) ? data.messages : [];
        if (messages.length !== lastCount) {
          lastCount = messages.length;
          render(messages);
        }
      } catch (error) {
        // Pages may still be publishing.
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const title = encodeURIComponent("[gsgs-chat]");
      const body = encodeURIComponent(text);
      location.href = "https://github.com/" + REPO + "/issues/new?title=" + title + "&body=" + body;
    });

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
